name: Daily dashboard refresh

on:
  schedule:
    # Sunday 23:00 UTC (early Monday) so the refresh lands BEFORE the local
    # Monday 08:00 inventory-email task, which reads the consts.json this run
    # commits. Use the in-dashboard "Refresh now" button for off-schedule updates.
    - cron: "0 23 * * 0"
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

permissions:
  contents: write           # allow the job to commit the refreshed index.html

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Checkout private build repo (model + assets)
        uses: actions/checkout@v4
        with:
          repository: kitbrianhernandez-ai/steyda-candy-build
          token: ${{ secrets.BUILD_REPO_TOKEN }}
          path: build/_private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r build/requirements.txt -r build/_private/requirements.txt

      - name: Build inventory consts (private model → consts.json)
        working-directory: build/_private
        env:
          DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
          # Joar Candy LIVE pull via Apps Script web app (preferred — on-demand staged).
          # Falls back to OAuth, then to the cached xlsx, if these are unset/unreachable.
          JOAR_WEBAPP_URL: ${{ secrets.JOAR_WEBAPP_URL }}
          JOAR_WEBAPP_TOKEN: ${{ secrets.JOAR_WEBAPP_TOKEN }}
          # Joar Candy auto-download (legacy OAuth — dormant; kept as a fallback)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          JOAR_SHEET_ID: ${{ secrets.JOAR_SHEET_ID }}
        run: python build_inventory.py

      - name: Publish consts.json to the private build repo
        # The Monday 08:00 local inventory-email task ("Billy") reads this file
        # instead of rebuilding. Requires BUILD_REPO_TOKEN to have contents:write.
        working-directory: build/_private
        run: |
          if [ -f out/consts.json ]; then
            git config user.name "steyda-refresh-bot"
            git config user.email "operations@steyda.com"
            git add -f out/consts.json
            if git diff --cached --quiet; then
              echo "consts.json unchanged."
            else
              git commit -m "consts.json refresh ($(date -u +%Y-%m-%d))"
              git push || echo "::warning::consts.json push failed (check BUILD_REPO_TOKEN write scope)"
            fi
          else
            echo "::warning::out/consts.json not found; Billy will fall back to a local build."
          fi

      - name: Refresh PPC + keywords + inventory and re-encrypt
        env:
          DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
          SITE_PW: ${{ secrets.SITE_PW }}
          INVENTORY_CONSTS: build/_private/out/consts.json
        run: python build/refresh.py

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "steyda-refresh-bot"
            git config user.email "operations@steyda.com"
            git add index.html
            git commit -m "Daily refresh ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed dashboard."
          else
            echo "No change to publish."
          fi
