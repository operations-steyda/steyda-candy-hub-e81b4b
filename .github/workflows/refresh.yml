name: Daily dashboard refresh

on:
  schedule:
    # 05:10 UTC daily ≈ 06:10–07:10 Sweden time. Adjust the cron if you want a different hour.
    - cron: "10 5 * * *"
  workflow_dispatch:        # adds a manual "Run workflow" button in the Actions tab

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

permissions:
  contents: write           # allow the job to commit the refreshed index.html

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r build/requirements.txt

      - name: Refresh PPC + keyword data (DataDoe) and re-encrypt
        env:
          DATADOE_API_KEY: ${{ secrets.DATADOE_API_KEY }}
          SITE_PW: ${{ secrets.SITE_PW }}
        run: python build/refresh.py

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "steyda-refresh-bot"
            git config user.email "operations@steyda.com"
            git add index.html
            git commit -m "Daily refresh: PPC + keywords ($(date -u +%Y-%m-%d))"
            git push
            echo "Pushed refreshed dashboard."
          else
            echo "No change to publish."
          fi
